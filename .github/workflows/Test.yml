name: Test AustralianElectricityMarkets
on:
  push:
    branches:
      - main
    tags: ["*"]
    paths:
      - "src/**"
      - "test/**"
      - "AustralianElectricityMarketsCache/src/**"
      - "AustralianElectricityMarketsData/src/**"
      - "data/**"
      - "**/*.toml"
      - "codecov.yml"
      - ".github/workflows/Test*.yml"
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "AustralianElectricityMarketsCache/src/**"
      - "AustralianElectricityMarketsData/src/**"
      - "data/**"
      - "**/*.toml"
      - "codecov.yml"
      - ".github/workflows/Test*.yml"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: AustralianElectricityMarkets - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    permissions:
      actions: write # needed to allow julia-actions/cache to proactively delete old caches that it has created
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.11"
          - "1.12"
          - "pre"
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: x64
      - name: Use Julia cache
        uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: .
      - uses: julia-actions/julia-runtest@v1
        with:
          project: .
          coverage: ${{ matrix.version == '1.11' }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.version == '1.11'
        with:
          directories: ./src
      - uses: codecov/codecov-action@v5
        if: matrix.version == '1.11'
        with:
          files: lcov.info
          flags: AustralianElectricityMarkets
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
