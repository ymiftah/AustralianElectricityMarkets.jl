name: Test against registered siblings

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: ${{ matrix.package }} - registered siblings
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          - "."
          - AustralianElectricityMarketsCache
          - AustralianElectricityMarketsData
          - AustralianElectricityMarketsSimulations
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
          arch: x64
      - name: Use Julia cache
        uses: julia-actions/cache@v2
      - name: Strip sources, workspace and manifests
        run: julia --color=yes .github/scripts/registered_mode.jl "$GITHUB_WORKSPACE"
      - name: Test ${{ matrix.package }}
        run: julia --color=yes --project=${{ matrix.package }} -e 'using Pkg; Pkg.test()'
