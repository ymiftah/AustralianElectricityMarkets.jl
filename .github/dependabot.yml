# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "julia"
    directories:
      - "/"
      - "/AustralianElectricityMarketsCache"
      - "/AustralianElectricityMarketsData"
      - "/AustralianElectricityMarketsSimulations"
    schedule:
      interval: "weekly"
    ignore:
      # Sibling packages are linked by [sources] paths and released together
      - dependency-name: "AustralianElectricityMarkets"
      - dependency-name: "AustralianElectricityMarketsCache"
      - dependency-name: "AustralianElectricityMarketsData"
      - dependency-name: "AustralianElectricityMarketsSimulations"
